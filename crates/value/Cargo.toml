[package]
name = "stablecoin-geo-lab"
version = "0.1.0"
edition = "2024"
description = "Purchasing power of stablecoins by holder country: fetch, panel, gap rules, metrics, export"
license = "MIT"

[lib]
name = "sgl"
path = "src/lib.rs"

[[bin]]
name = "sgl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
